<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | Highschool e-Sports Community</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="word-header"><a href="index.html">Highschool e-Sports Community</a></h1>
        <nav>
            <ul>
                <li><a href="index.html">トップ</a></li>
                <li><a href="members.html">メンバー</a></li>
                <li><a href="news.html">ニュース</a></li>
                <li><a href="contact.html" class="active">お問い合わせ</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-section">
        <h2>お問い合わせ</h2>
        <p class="form-text">コミュニティへの参加希望、合同練習の申し込み、その他ご質問はこちらからお気軽にご連絡ください。</p>
        
        <form action="https://formspree.io/f/xnpqgqdk" method="post" id="contactForm" class="contact-form">
            <div class="form-group">
                <label for="school">学校名・所属</label>
                <input name="school" type="text" id="school" required placeholder="例：〇〇高等学校 e-Sports部">
            </div>
            <div class="form-group">
                <label for="name">お名前</label>
                <input  name="name" type="text" id="name" required placeholder="例：山田 太郎">
            </div>
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input name="email" type="email" id="email" required placeholder="例：example@email.com">
            </div>
            <div class="form-group">
                <label for="message">お問い合わせ内容</label>
                <textarea name="message" id="message" rows="5" required placeholder="合同練習の希望日時や、質問内容をご記入ください。"></textarea>
            </div>
            <button type="submit" class="btn">送信する</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Highschool e-Sports Community</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
